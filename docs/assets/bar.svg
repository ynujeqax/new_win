<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="NewWin bar: a glass capsule at the top of a black screen with app names on the left and network, volume, search, date and time on the right">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.045"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-50%" width="110%" height="250%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#screen)"/>
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="1152" height="48" rx="24" fill="url(#glass)"/>
    <rect x="24.5" y="24.5" width="1151" height="47" rx="23.5" fill="none" stroke="url(#rim)"/>
  </g>
  <g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="16" fill="#9a9a9a">
    <path d="M52 52l7-7 7 7" fill="none" stroke="#ececec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="82" y="38" width="1" height="20" fill="#fff" opacity="0.14"/>
    <rect x="98" y="34" width="84" height="28" rx="9" fill="#fff" opacity="0.11"/>
    <text x="140" y="53" text-anchor="middle" fill="#fff" font-weight="600">Firefox</text>
    <text x="214" y="53">Code</text>
    <text x="276" y="53">Terminal</text>
    <text x="368" y="53">Spotify</text>
    <text x="760" y="53" fill="#ececec">ENG</text>
    <g fill="none" stroke="#ececec" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M816 54a14 14 0 0 1 20 0M820 50a8.5 8.5 0 0 1 12 0"/>
      <circle cx="826" cy="57" r="1" fill="#ececec"/>
      <path d="M862 44v12M858 47h-4v6h4l6 5V42z"/>
      <circle cx="905" cy="47" r="6"/>
      <path d="M909.5 51.5l4.5 4.5"/>
    </g>
    <rect x="934" y="38" width="1" height="20" fill="#fff" opacity="0.14"/>
    <text x="952" y="53" fill="#ececec">Sat Oct 24</text>
    <text x="1062" y="53" fill="#fff" font-weight="700">13:32</text>
  </g>
  <g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" fill="#fff" opacity="0.92">
    <text x="600" y="168" text-anchor="middle" font-size="44" font-weight="600" letter-spacing="-0.5">NewWin</text>
    <text x="600" y="206" text-anchor="middle" font-size="18" fill="#8a8a8a">A liquid-glass top bar that replaces the Windows 11 taskbar and Start menu</text>
  </g>
</svg>
