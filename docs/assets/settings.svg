<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="NewWin Settings: a glass window with six sections on the left and the Bar section open: mode Auto-hide or Pinned, show and hide delay sliders, toggles for full-screen apps and starting with Windows">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#17191f"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="460" rx="20" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="36" width="680" height="388" rx="16" fill="url(#glass)"/>
    <rect x="40.5" y="36.5" width="679" height="387" rx="15.5" fill="none" stroke="url(#rim)"/>
  </g>

  <g font-family="Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- title bar -->
    <text x="64" y="68" font-size="13" fill="#9a9a9a">NewWin Settings</text>
    <path d="M672 58l8 8M680 58l-8 8" stroke="#9a9a9a" stroke-width="1.3" stroke-linecap="round"/>

    <!-- navigation -->
    <g font-size="14">
      <rect x="54" y="88" width="150" height="34" rx="8" fill="#fff" opacity="0.14"/>
      <text x="70" y="110" fill="#fff" font-weight="600">Bar</text>
      <text x="70" y="144" fill="#9a9a9a">Appearance</text>
      <text x="70" y="178" fill="#9a9a9a">Items</text>
      <text x="70" y="212" fill="#9a9a9a">Spotlight</text>
      <text x="70" y="246" fill="#9a9a9a">Tray</text>
      <text x="70" y="280" fill="#9a9a9a">About</text>
    </g>
    <rect x="218" y="88" width="1" height="318" fill="#fff" opacity="0.10"/>

    <!-- content -->
    <g font-size="14">
      <text x="242" y="104" font-size="11.5" fill="#6f6f6f" letter-spacing="1">BEHAVIOR</text>

      <text x="242" y="138" fill="#ececec">Mode</text>
      <rect x="512" y="120" width="184" height="28" rx="14" fill="#fff" opacity="0.07"/>
      <rect x="514" y="122" width="92" height="24" rx="12" fill="#fff" opacity="0.18"/>
      <text x="560" y="139" text-anchor="middle" fill="#fff" font-weight="600" font-size="13">Auto-hide</text>
      <text x="650" y="139" text-anchor="middle" fill="#9a9a9a" font-size="13">Pinned</text>

      <text x="242" y="180" fill="#ececec">Show delay</text>
      <rect x="512" y="173" width="136" height="3" rx="1.5" fill="#fff" opacity="0.14"/>
      <rect x="512" y="173" width="20" height="3" rx="1.5" fill="#fff"/>
      <circle cx="532" cy="174.5" r="7" fill="#fff"/>
      <text x="696" y="180" text-anchor="end" fill="#9a9a9a" font-size="13">150 ms</text>

      <text x="242" y="220" fill="#ececec">Hide delay</text>
      <rect x="512" y="213" width="136" height="3" rx="1.5" fill="#fff" opacity="0.14"/>
      <rect x="512" y="213" width="54" height="3" rx="1.5" fill="#fff"/>
      <circle cx="566" cy="214.5" r="7" fill="#fff"/>
      <text x="696" y="220" text-anchor="end" fill="#9a9a9a" font-size="13">400 ms</text>

      <text x="242" y="260" fill="#ececec">Hide over full-screen apps</text>
      <rect x="660" y="245" width="36" height="20" rx="10" fill="#fff"/>
      <circle cx="686" cy="255" r="7" fill="#000"/>

      <rect x="242" y="286" width="454" height="1" fill="#fff" opacity="0.10"/>
      <text x="242" y="316" font-size="11.5" fill="#6f6f6f" letter-spacing="1">SYSTEM</text>

      <text x="242" y="350" fill="#ececec">Start with Windows</text>
      <rect x="660" y="335" width="36" height="20" rx="10" fill="#fff"/>
      <circle cx="686" cy="345" r="7" fill="#000"/>

      <text x="242" y="396" font-size="12" fill="#6f6f6f">Every change reaches the bar live — no Save button.</text>
    </g>
  </g>
</svg>
