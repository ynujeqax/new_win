<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="New in 1.0.3 to 1.0.5: Spotlight answering 10 km in mi with 6.21371 mi, the media panel playing Bohemian Rhapsody by Queen with previous, pause and next buttons, and the calendar for October 2026 with today, the 26th, in a white disc">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#15171d"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="460" rx="20" fill="url(#bg)"/>

  <g filter="url(#shadow)" fill="url(#glass)">
    <rect x="60" y="40" width="640" height="168" rx="16"/>
    <rect x="160" y="248" width="440" height="172" rx="16"/>
    <rect x="780" y="40" width="380" height="380" rx="16"/>
  </g>

  <g font-family="Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- Spotlight: calculator and unit converter -->
    <circle cx="92" cy="74" r="7" fill="none" stroke="#9a9a9a" stroke-width="1.6"/>
    <path d="M97 79l5 5" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
    <text x="114" y="81" font-size="20" fill="#fff">10 km in mi</text>
    <rect x="216" y="63" width="1.5" height="23" fill="#fff"/>
    <rect x="68" y="102" width="624" height="1" fill="#fff" opacity="0.12"/>
    <rect x="68" y="112" width="624" height="48" rx="8" fill="#fff" opacity="0.10"/>
    <text x="86" y="143" font-size="20" fill="#ececec">=</text>
    <text x="112" y="144" font-size="22" font-weight="700" fill="#fff">6.21371 mi</text>
    <text x="676" y="141" text-anchor="end" font-size="12" fill="#9a9a9a">Conversion</text>
    <text x="380" y="190" text-anchor="middle" font-size="11.5" fill="#6f6f6f">↵ copy · Esc close</text>

    <!-- media panel -->
    <text x="188" y="290" font-size="19" font-weight="700" fill="#fff">Bohemian Rhapsody</text>
    <text x="188" y="315" font-size="15" fill="#ececec">Queen</text>
    <text x="188" y="336" font-size="12" fill="#9a9a9a">Spotify</text>
    <circle cx="320" cy="378" r="20" fill="#fff" opacity="0.12"/>
    <g fill="#fff">
      <path d="M311 371h2.6v14H311zM326 371v14l-10.5-7zM333 371v14l-7-7z" transform="translate(-1 0)"/>
      <rect x="374" y="370" width="4" height="16" rx="1"/>
      <rect x="382" y="370" width="4" height="16" rx="1"/>
    </g>
    <g fill="#fff" opacity="0.35">
      <path d="M432 371v14l7-7zM439 371v14l7-7zM447.4 371h2.6v14h-2.6z"/>
    </g>

    <!-- calendar under the date -->
    <text x="806" y="84" font-size="18" font-weight="600" fill="#fff">October 2026</text>
    <path d="M1102 69l-6 6 6 6M1132 69l6 6-6 6" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="12" fill="#9a9a9a" text-anchor="middle">
