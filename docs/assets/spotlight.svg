<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Spotlight: a centred glass panel with the query co and results Code, Command Prompt, Control Panel, Discord and Computer Management, the matched letters in bold">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#15171d"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ea8ff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#16181d"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fc3ff"/><stop offset="1" stop-color="#2a7fd4"/></linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#5a46e6"/></linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc14d"/><stop offset="1" stop-color="#e08a1f"/></linearGradient>
  </defs>

  <rect width="760" height="420" rx="20" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="56" width="560" height="304" rx="16" fill="url(#glass)"/>
  </g>

  <g font-family="Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- field -->
    <circle cx="132" cy="88" r="7" fill="none" stroke="#9a9a9a" stroke-width="1.6"/>
    <path d="M137 93l5 5" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
    <text x="154" y="95" font-size="20" fill="#fff">co</text>
    <rect x="176" y="77" width="1.5" height="23" fill="#fff"/>
    <rect x="108" y="116" width="544" height="1" fill="#fff" opacity="0.12"/>

    <!-- rows -->
    <g font-size="15">
      <rect x="108" y="124" width="544" height="38" rx="8" fill="#fff" opacity="0.10"/>
      <rect x="122" y="135" width="16" height="16" rx="4" fill="url(#a)"/>
      <path d="M127 140l-2.5 3 2.5 3M133 140l2.5 3-2.5 3" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="148" y="148" fill="#fff"><tspan font-weight="700">Co</tspan>de</text>
      <text x="636" y="148" text-anchor="end" font-size="12" fill="#9a9a9a">App</text>

      <rect x="122" y="173" width="16" height="16" rx="3" fill="url(#b)" stroke="#fff" stroke-opacity="0.25"/>
      <path d="M125.5 178l3 3-3 3M130 184.5h4.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="148" y="186" fill="#ececec"><tspan font-weight="700" fill="#fff">Co</tspan>mmand Prompt</text>
      <text x="636" y="186" text-anchor="end" font-size="12" fill="#6f6f6f">App</text>

      <rect x="122" y="211" width="16" height="16" rx="4" fill="url(#c)"/>
      <rect x="125" y="215" width="10" height="7" rx="1" fill="none" stroke="#fff" stroke-width="1.3"/>
      <path d="M128 224.5h4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
      <text x="148" y="224" fill="#ececec"><tspan font-weight="700" fill="#fff">Co</tspan>ntrol Panel</text>
      <text x="636" y="224" text-anchor="end" font-size="12" fill="#6f6f6f">App</text>

      <rect x="122" y="249" width="16" height="16" rx="4" fill="url(#d)"/>
      <path d="M126 260.5v-6l4 3.5 4-3.5v6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="148" y="262" fill="#ececec">Dis<tspan font-weight="700" fill="#fff">co</tspan>rd</text>
      <text x="636" y="262" text-anchor="end" font-size="12" fill="#6f6f6f">App</text>

      <rect x="122" y="287" width="16" height="16" rx="4" fill="url(#e)"/>
      <circle cx="130" cy="295" r="3.6" fill="none" stroke="#fff" stroke-width="1.4"/>
      <path d="M130 289.5v1.6M130 298.9v1.6M124.5 295h1.6M133.9 295h1.6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <text x="148" y="300" fill="#ececec"><tspan font-weight="700" fill="#fff">Co</tspan>mputer Management</text>
      <text x="636" y="300" text-anchor="end" font-size="12" fill="#6f6f6f">System</text>
    </g>

    <!-- key hints -->
    <rect x="108" y="320" width="544" height="1" fill="#fff" opacity="0.12"/>
    <text x="380" y="344" text-anchor="middle" font-size="11.5" fill="#6f6f6f">↑↓ select · ↵ open · Ctrl ↵ run as administrator · Esc close</text>
  </g>
</svg>
