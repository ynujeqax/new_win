[package]
name = "newwin-settings"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "NewWinSettings"
path = "src/main.rs"

[dependencies]
newwin-core.workspace = true
newwin-config.workspace = true
newwin-platform.workspace = true
newwin-ui.workspace = true
log.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5.1"
