[package]
name = "newwin-shell"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "NewWin"
path = "src/main.rs"

[dependencies]
newwin-core.workspace = true
newwin-config.workspace = true
newwin-platform.workspace = true
newwin-ui.workspace = true
log.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5.1"
